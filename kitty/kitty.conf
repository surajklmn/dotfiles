# --- Typography (Requires JetBrainsMono Nerd Font) ---
#font_family      JetBrainsMono Nerd Font
font_family      Maple Mono NFM
bold_font        auto
italic_font      auto
font_size        11.5
disable_ligatures cursor

# --- The Perfect Cursor Trail Setup ---
cursor_shape                 block
cursor_trail                 10
cursor_trail_start_threshold 0
cursor_trail_decay           0.1 0.45

# --- Window Layout & Eye Candy ---
window_padding_width         12
background_opacity           0.85
background_blur              32
dynamic_background_opacity   yes
resize_in_steps              yes
hide_window_decorations      yes
confirm_os_window_close      0

# --- Window Borders & Tab Bar ---
window_border_width          1px
draw_minimal_borders         yes
tab_bar_style                powerline
tab_powerline_style          round
tab_bar_align                center
tab_bar_min_tabs             2

# --- Mouse & Clipboard Ergonomics ---
copy_on_select               yes
detect_urls                  yes
mouse_map right_click ungrabbed paste_from_clipboard

# --- Quality of Life Fixes ---
enable_audio_bell            no
update_check_interval        0

# --- Color Scheme: Tokyo Night ---
include themes/tokyo-night.conf
